# ORB-SLAM3 Configuration for IFM O3R OVP811
# Camera: OVP811 with 2x RGBD heads (RGB + ToF)

%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters (from IFM O3R Factory Calibration)
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# RGB Camera (2D head) - 1280x800
Camera.width: 1280
Camera.height: 800

# Intrinsics (fx, fy, cx, cy)
# WARNING: These are PLACEHOLDER values - must be extracted from O3R
# Use ifm3d API to get actual calibration data
Camera1.fx: 565.44
Camera1.fy: 565.44
Camera1.cx: 640.0
Camera1.cy: 400.0

# Distortion coefficients (radtan model: k1, k2, p1, p2, k3)
# PLACEHOLDER - extract from camera
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

# Camera FPS
Camera.fps: 20.0

# Color order (0: BGR, 1: RGB)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# Depth Camera Settings
#--------------------------------------------------------------------------------------------
# Depth map factor: converts depth values to meters
# O3R outputs in millimeters by default
RGBD.DepthMapFactor: 1000.0

# Far threshold (40x baseline for stereo equivalent)
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# ORB Extractor Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

#--------------------------------------------------------------------------------------------
# File version (required by ORB-SLAM3)
#--------------------------------------------------------------------------------------------
File.version: "1.0"
